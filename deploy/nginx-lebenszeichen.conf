# ---------------------------------------------------------------------------
#  Lebenszeichen — nginx site
#
#  Prerequisite: DNS must already resolve, or certbot cannot validate.
#      lebenszeichen.io      A   93.183.80.122
#      www.lebenszeichen.io  A   93.183.80.122
#
#  Install:
#    sudo cp /var/www/lebenszeichen/deploy/nginx-lebenszeichen.conf \
#            /etc/nginx/sites-available/lebenszeichen
#    sudo ln -s /etc/nginx/sites-available/lebenszeichen /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d lebenszeichen.io -d www.lebenszeichen.io
#
#  certbot rewrites this file to add the TLS server block and the redirect from
#  port 80. Nothing below needs editing by hand.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name lebenszeichen.io www.lebenszeichen.io;

    # certbot writes its challenge here before TLS exists
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The rate limiter reads this to identify clients — do not drop it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # URL import and AI generation can legitimately take ~60 s
        proxy_read_timeout 120s;
    }

    # Uploads are served straight off disk, bypassing Node entirely
    location /uploads/ {
        alias /var/www/lebenszeichen/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploads must exceed UPLOAD_MAX_MB, or large images fail at the proxy
    client_max_body_size 12M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}

# ---------------------------------------------------------------------------
#  After certbot runs it rewrites the block above and adds the TLS server.
#  Then add this redirect so Google only ever sees one canonical host:
#
#    if ($host = www.lebenszeichen.io) { return 301 https://lebenszeichen.io$request_uri; }
# ---------------------------------------------------------------------------
